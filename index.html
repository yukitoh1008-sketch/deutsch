const KEY_STORE="wk-key";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const toB64=u=>btoa(String.fromCharCode(...u));
async function derive(pass){const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass.normalize("NFC")),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64(BLOB.salt),iterations:BLOB.iter},km,256))}
async function open_(raw){const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(BLOB.iv)},k,b64(BLOB.ct)))}
function mount(html){document.getElementById("lock").hidden=true;const app=document.getElementById("app");app.innerHTML=html;
  for(const old of app.querySelectorAll("script")){const s=document.createElement("script");s.textContent=old.textContent;old.replaceWith(s)}}
function getKey(){try{return localStorage.getItem(KEY_STORE)}catch(e){return null}}
async function boot(){const k=getKey();
  if(k){try{mount(await open_(b64(k)));return}catch(e){}}
  document.getElementById("lock").hidden=false}
document.getElementById("lockForm").addEventListener("submit",async e=>{e.preventDefault();
  const pw=document.getElementById("pw").value.trim(),btn=document.getElementById("go"),err=document.getElementById("err");
  if(!pw)return;btn.disabled=true;btn.textContent="確認中…";err.hidden=true;
  try{const raw=await derive(pw);const html=await open_(raw);try{localStorage.setItem(KEY_STORE,toB64(raw))}catch(e){}mount(html)}
  catch(x){err.hidden=false;btn.disabled=false;btn.textContent="開く"}});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
boot();
</script>
